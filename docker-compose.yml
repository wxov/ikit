services:
  ikit:
    build: .
    container_name: ikit
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      KB_STORAGE: sqlite
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      UPDATE_INSTALLER_URL_TAURI: ${UPDATE_INSTALLER_URL_TAURI:-}
      UPDATE_INSTALLER_URL_ANDROID: ${UPDATE_INSTALLER_URL_ANDROID:-}
      UPDATE_KIND: ${UPDATE_KIND:-hot}
      UPDATE_INSTALLER_URL: ${UPDATE_INSTALLER_URL:-}
      UPDATE_INSTALLER_URL_WEB: ${UPDATE_INSTALLER_URL_WEB:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PLUGIN_DIR: ${PLUGIN_DIR:-}
      WEB_DIST: ${WEB_DIST:-}
    volumes:
      - ikit-data:/app/packages/server/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ikit-data:
