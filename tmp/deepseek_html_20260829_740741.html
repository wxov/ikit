<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>个人知识库 · 布局二（左列表·中内容·右标签）</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-list: #ffffff;
            --bg-content: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-list: #1e293b;
            --bg-content: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 主容器：三栏 ===== */
        .container {
            display: flex;
            height: 100vh;
            max-width: 1440px;
            margin: 0 auto;
            padding: 12px;
            gap: 12px;
        }

        /* ===== 左侧：文档列表 ===== */
        .list-panel {
            width: 280px;
            min-width: 240px;
            background: var(--bg-list);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .list-panel .header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .list-panel .header .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .list-panel .header .logo span {
            background: var(--primary);
            color: white;
            border-radius: 4px;
            padding: 0 6px;
            font-size: 11px;
        }
        .list-panel .header .search {
            flex: 1;
            min-width: 100px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border var(--transition);
        }
        .list-panel .header .search:focus {
            border-color: var(--primary);
        }
        .list-panel .header .btn-new {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            transition: background var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .list-panel .header .btn-new:hover {
            background: var(--primary-hover);
        }

        .list-panel .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
        }
        .list-panel .doc-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .list-panel .doc-item:hover {
            background: var(--bg);
        }
        .list-panel .doc-item.active {
            background: var(--primary);
            color: white;
        }
        .list-panel .doc-item.active .meta,
        .list-panel .doc-item.active .tags span {
            color: rgba(255, 255, 255, 0.8);
        }
        .list-panel .doc-item .title {
            font-weight: 500;
            font-size: 14px;
        }
        .list-panel .doc-item .meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .list-panel .doc-item .tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .list-panel .doc-item .tags span {
            background: var(--border);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        .list-panel .doc-item.active .tags span {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
        }

        /* ===== 中间：内容展示区（核心） ===== */
        .content-panel {
            flex: 1;
            min-width: 300px;
            background: var(--bg-content);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 36px;
            overflow-y: auto;
            transition: background var(--transition);
        }
        .content-panel .doc-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .content-panel .doc-meta {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .content-panel .doc-body {
            font-size: 16px;
            line-height: 1.8;
        }
        .content-panel .doc-body h1,
        .content-panel .doc-body h2 {
            margin: 1.4em 0 0.5em;
            font-weight: 600;
        }
        .content-panel .doc-body h1 { font-size: 24px; }
        .content-panel .doc-body h2 { font-size: 20px; }
        .content-panel .doc-body p { margin: 0.6em 0; }
        .content-panel .doc-body code {
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'JetBrains Mono', monospace;
        }
        .content-panel .doc-body pre {
            background: var(--bg);
            padding: 16px 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .content-panel .doc-body blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 18px;
            color: var(--text-secondary);
            margin: 16px 0;
            font-style: italic;
        }
        .content-panel .doc-body ul,
        .content-panel .doc-body ol {
            padding-left: 24px;
            margin: 0.6em 0;
        }
        .content-panel .doc-body li { margin: 0.2em 0; }
        .content-panel .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
        }
        .content-panel .empty-state .icon {
            font-size: 72px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        .content-panel .empty-state h3 {
            font-size: 20px;
            font-weight: 500;
        }
        .content-panel .empty-state p {
            margin-top: 8px;
            font-size: 15px;
        }

        /* ===== 右侧：标签导航（新位置） ===== */
        .sidebar {
            width: 200px;
            min-width: 160px;
            background: var(--bg-sidebar);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            transition: background var(--transition);
        }
        .sidebar .label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 10px 4px;
        }
        .sidebar .nav-item {
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 14px;
            margin-bottom: 1px;
        }
        .sidebar .nav-item:hover {
            background: var(--border);
            color: var(--text);
        }
        .sidebar .nav-item.active {
            background: var(--primary);
            color: white;
        }
        .sidebar .nav-item .count {
            margin-left: auto;
            font-size: 11px;
            background: var(--border);
            padding: 0 8px;
            border-radius: 10px;
            color: var(--text-secondary);
        }
        .sidebar .nav-item.active .count {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
        }
        .sidebar .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }
        .sidebar .footer-links {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .sidebar .footer-links .nav-item {
            font-size: 13px;
        }

        /* ===== 暗色切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* ===== 视图切换（PC / 手机） ===== */
        .view-toggle {
            position: fixed;
            bottom: 88px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 999;
        }
        .view-toggle button {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .view-toggle button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ===== 移动端模拟框 ===== */
        .mobile-frame {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 390px;
            height: 780px;
            background: var(--bg);
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            z-index: 1000;
            border: 2px solid var(--border);
            flex-direction: column;
        }
        .mobile-frame.active {
            display: flex;
        }
        .mobile-frame .status-bar {
            height: 44px;
            background: var(--bg-sidebar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .mobile-frame .mobile-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .mobile-frame .mobile-content .m-doc-item {
            background: var(--bg-sidebar);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
        }
        .mobile-frame .mobile-content .m-doc-item .m-title {
            font-weight: 600;
            font-size: 15px;
        }
        .mobile-frame .mobile-content .m-doc-item .m-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .mobile-frame .mobile-content .m-doc-item .m-tags {
            margin-top: 4px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .mobile-frame .mobile-content .m-doc-item .m-tags span {
            background: var(--border);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        .mobile-frame .mobile-tab {
            height: 64px;
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .mobile-frame .mobile-tab .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            gap: 2px;
        }
        .mobile-frame .mobile-tab .tab-item.active {
            color: var(--primary);
        }
        .mobile-frame .mobile-tab .tab-item .icon {
            font-size: 22px;
        }
        .mobile-frame .mobile-tab .tab-item.center {
            background: var(--primary);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            justify-content: center;
            margin-top: -16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .mobile-frame .mobile-tab .tab-item.center .icon {
            font-size: 24px;
        }

        /* ===== 响应式：小屏 ===== */
        @media (max-width: 1024px) {
            .sidebar { width: 160px; min-width: 120px; }
            .list-panel { width: 220px; min-width: 180px; }
        }
        @media (max-width: 820px) {
            .container {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
                height: auto;
                overflow-y: auto;
            }
            .list-panel {
                width: 100%;
                min-width: unset;
                max-height: 280px;
            }
            .list-panel .header .logo { font-size: 16px; }
            .content-panel {
                min-width: unset;
                padding: 20px;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 2px;
                padding: 8px 12px;
                height: auto;
                overflow-y: visible;
                max-height: 120px;
            }
            .sidebar .label,
            .sidebar .divider,
            .sidebar .footer-links { display: none; }
            .sidebar .nav-item { font-size: 13px; padding: 4px 10px; }
            .sidebar .nav-item .count { display: none; }
            .mobile-frame { display: none !important; }
            .view-toggle { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== 主容器 ===== -->
    <div class="container" id="app">

        <!-- 左侧：文档列表 -->
        <div class="list-panel">
            <div class="header">
                <div class="logo">📚 <span>个人</span></div>
                <input class="search" type="text" placeholder="🔍 搜索..." />
                <button class="btn-new">+ 新建</button>
            </div>
            <div class="doc-list" id="docList">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <!-- 中间：内容展示区 -->
        <div class="content-panel" id="contentPanel">
            <div class="empty-state">
                <div class="icon">📖</div>
                <h3>选择一篇知识开始阅读</h3>
                <p>点击左侧列表中的文档，内容将在这里展示</p>
            </div>
        </div>

        <!-- 右侧：标签导航（新位置） -->
        <aside class="sidebar">
            <div class="label">🏷️ 全部标签</div>
            <div class="nav-item active"># 全部 <span class="count">12</span></div>
            <div class="nav-item"># 技术 <span class="count">5</span></div>
            <div class="nav-item"># 生活 <span class="count">3</span></div>
            <div class="nav-item"># 产品 <span class="count">2</span></div>
            <div class="nav-item"># React <span class="count">2</span></div>
            <hr class="divider">
            <div class="label">📂 分类</div>
            <div class="nav-item">📁 全部知识</div>
            <div class="nav-item">📁 技术笔记</div>
            <div class="nav-item">📁 生活灵感</div>
            <hr class="divider">
            <div class="footer-links">
                <div class="nav-item">📥 归档</div>
                <div class="nav-item">🗑️ 回收站</div>
            </div>
        </aside>
    </div>

    <!-- ===== 移动端模拟框 ===== -->
    <div class="mobile-frame" id="mobileFrame">
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        <div class="mobile-content">
            <div class="m-doc-item">
                <div class="m-title">📌 设计模式速查表</div>
                <div class="m-meta">10分钟前</div>
                <div class="m-tags"><span>#技术</span><span>#编程</span></div>
            </div>
            <div class="m-doc-item">
                <div class="m-title">📝 2026年阅读计划</div>
                <div class="m-meta">昨天</div>
                <div class="m-tags"><span>#生活</span><span>#读书</span></div>
            </div>
            <div class="m-doc-item">
                <div class="m-title">💡 产品思维模型</div>
                <div class="m-meta">3天前</div>
                <div class="m-tags"><span>#产品</span><span>#思维</span></div>
            </div>
            <div class="m-doc-item">
                <div class="m-title">⚛️ React 性能优化</div>
                <div class="m-meta">5天前</div>
                <div class="m-tags"><span>#React</span><span>#前端</span></div>
            </div>
        </div>
        <div class="mobile-tab">
            <div class="tab-item active"><span class="icon">🏠</span>首页</div>
            <div class="tab-item"><span class="icon">🔍</span>搜索</div>
            <div class="tab-item center"><span class="icon">✏️</span></div>
            <div class="tab-item"><span class="icon">🏷️</span>标签</div>
            <div class="tab-item"><span class="icon">👤</span>我的</div>
        </div>
    </div>

    <!-- ===== 控制按钮 ===== -->
    <div class="view-toggle">
        <button id="viewPc" class="active">💻 PC</button>
        <button id="viewMobile">📱 手机</button>
    </div>
    <button class="theme-toggle" id="themeToggle">🌓</button>

    <script>
        // ===== 文档数据 =====
        const docs = [{
            id: 1,
            title: '设计模式速查表',
            tags: ['技术', '编程'],
            updated: '10分钟前',
            content: `
                <h1>设计模式速查表</h1>
                <p>常用设计模式分类：<strong>创建型</strong>、<strong>结构型</strong>、<strong>行为型</strong>。</p>
                <h2>创建型</h2>
                <ul><li>单例模式</li><li>工厂模式</li><li>建造者模式</li></ul>
                <pre><code>// 单例示例
        class Singleton {
          static instance;
          constructor() {
            if (Singleton.instance) return Singleton.instance;
            Singleton.instance = this;
          }
        }</code></pre>
                <blockquote>设计模式是软件设计的"套路"，能提升代码的可维护性。</blockquote>
                <p>掌握这些模式，可以让你的代码更优雅、更易于扩展。</p>
            `
        }, {
            id: 2,
            title: '2026年阅读计划',
            tags: ['生活', '读书'],
            updated: '昨天',
            content: `
                <h1>📚 2026年阅读计划</h1>
                <p>目标：<strong>50本书</strong>，涵盖技术、文学、心理学三个领域。</p>
                <h2>📖 书单精选</h2>
                <ul>
                    <li>《你当像鸟飞往你的山》 — Tara Westover</li>
                    <li>《系统设计面试》 — Alex Xu</li>
                    <li>《思考，快与慢》 — Daniel Kahneman</li>
                    <li>《深度工作》 — Cal Newport</li>
                </ul>
                <blockquote>读书是在别人思想的帮助下，建立自己的思想。</blockquote>
            `
        }, {
            id: 3,
            title: '产品思维模型',
            tags: ['产品', '思维'],
            updated: '3天前',
            content: `
                <h1>产品思维模型</h1>
                <p>从用户需求出发，构建 MVP，快速迭代。</p>
                <h2>核心模型</h2>
                <ul>
                    <li><strong>KANO 模型</strong> — 区分基本需求、期望需求和兴奋需求</li>
                    <li><strong>AARRR 漏斗</strong> — 获客、激活、留存、收入、传播</li>
                    <li><strong>双钻设计模型</strong> — 发散与收敛的交替</li>
                </ul>
                <p>好的产品经理是"用户代言人"，永远站在用户视角思考问题。</p>
            `
        }, {
            id: 4,
            title: 'React 性能优化',
            tags: ['React', '前端'],
            updated: '5天前',
            content: `
                <h1>React 性能优化实践</h1>
                <p>使用 <code>React.memo</code>、<code>useCallback</code>、<code>useMemo</code> 减少不必要的渲染。</p>
                <pre><code>const MemoComponent = React.memo(MyComponent);\n\nfunction Parent() {\n  const handleClick = useCallback(() => {}, []);\n  const data = useMemo(() => ({ name: 'react' }), []);\n  return &lt;MemoComponent onClick={handleClick} data={data} /&gt;;\n}</code></pre>
                <p>代码分割（Lazy + Suspense）可显著提升首屏加载速度。</p>
                <blockquote>优化不是一蹴而就的，需要持续测量和改进。</blockquote>
            `
        }];

        // ===== DOM 引用 =====
        const docListEl = document.getElementById('docList');
        const contentPanel = document.getElementById('contentPanel');

        // ===== 渲染列表 =====
        function renderList(activeId) {
            docListEl.innerHTML = docs.map(d => `
                <div class="doc-item ${d.id === activeId ? 'active' : ''}" data-id="${d.id}">
                    <div class="title">${d.title}</div>
                    <div class="meta">
                        <span>📅 ${d.updated}</span>
                        <div class="tags">${d.tags.map(t => `<span>#${t}</span>`).join('')}</div>
                    </div>
                </div>
            `).join('');

            // 点击事件
            docListEl.querySelectorAll('.doc-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const doc = docs.find(d => d.id === id);
                    if (doc) {
                        showContent(doc);
                        renderList(id);
                    }
                });
            });
        }

        // ===== 展示内容 =====
        function showContent(doc) {
            contentPanel.innerHTML = `
                <div class="doc-title">${doc.title}</div>
                <div class="doc-meta">
                    <span>🏷️ ${doc.tags.join(' · ')}</span>
                    <span>🕒 ${doc.updated}</span>
                    <span>📄 ${Math.ceil(doc.content.length / 200)} 分钟阅读</span>
                </div>
                <div class="doc-body">${doc.content}</div>
            `;
        }

        // ===== 初始化：默认选中第一篇 =====
        renderList(docs[0].id);
        showContent(docs[0]);

        // ===== 暗色切换 =====
        const themeBtn = document.getElementById('themeToggle');
        let dark = false;
        themeBtn.addEventListener('click', () => {
            dark = !dark;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
            themeBtn.textContent = dark ? '☀️' : '🌓';
        });

        // ===== PC / 手机视图切换 =====
        const pcBtn = document.getElementById('viewPc');
        const mobileBtn = document.getElementById('viewMobile');
        const mobileFrame = document.getElementById('mobileFrame');

        pcBtn.addEventListener('click', () => {
            mobileFrame.classList.remove('active');
            pcBtn.classList.add('active');
            mobileBtn.classList.remove('active');
        });
        mobileBtn.addEventListener('click', () => {
            mobileFrame.classList.add('active');
            mobileBtn.classList.add('active');
            pcBtn.classList.remove('active');
        });

        // 点击模拟框背景关闭
        mobileFrame.addEventListener('click', (e) => {
            if (e.target === mobileFrame) {
                mobileFrame.classList.remove('active');
                pcBtn.classList.add('active');
                mobileBtn.classList.remove('active');
            }
        });
    </script>
</body>
</html>
